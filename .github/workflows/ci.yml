name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20

    steps:
      - name: Install test dependencies
        run: pacman -Syu --noconfirm --needed git python nodejs jq quickshell calibre

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch pinned Omarchy source
        env:
          OMARCHY_REVISION: ed7bae4ac5a570e9df307486e0202fdafcc6ee24
        run: |
          git init "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" remote add origin https://github.com/basecamp/omarchy.git
          git -C "$RUNNER_TEMP/omarchy" fetch --depth 1 origin "$OMARCHY_REVISION"
          git -C "$RUNNER_TEMP/omarchy" checkout --detach FETCH_HEAD

      - name: Validate plugin manifest
        run: bash "$RUNNER_TEMP/omarchy/bin/omarchy-plugin-validate" .

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run model tests
        run: node tests/model-test.js

      - name: Lint QML
        run: OMARCHY_SHELL_PATH="$RUNNER_TEMP/omarchy/shell" tests/qml-lint-test.sh

      - name: Check patch hygiene
        run: |
          git diff --check
          empty_tree=$(git hash-object -t tree -w /dev/null)
          git diff --check "$empty_tree" HEAD
